# Docker Compose configuration for AWS development environment
# Uses external RDS PostgreSQL database
version: '3.8'

services:
  # Redis service (keeping in container for dev simplicity)
  redis:
    command: --save 60 1 --loglevel warning
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - redis-cli ping | grep PONG
      timeout: 3s
    image: docker.io/library/redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # Authentik server
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: server
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.dev
    environment:
      # Database connection to external RDS
      AUTHENTIK_POSTGRESQL__HOST: ${PG_HOST}
      AUTHENTIK_POSTGRESQL__PORT: ${PG_PORT}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER}
      # Redis connection
      AUTHENTIK_REDIS__HOST: redis
      # Security settings
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    ports:
      - "${COMPOSE_PORT_HTTP:-9000}:9000"
      - "${COMPOSE_PORT_HTTPS:-9443}:9443"
    restart: unless-stopped
    volumes:
      - ./media:/media
      - ./custom-templates:/templates
    labels:
      # Labels for AWS deployment (ECS, etc.)
      - "app=authentik"
      - "service=server"
      - "environment=dev"

  # Authentik worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: worker
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.dev
    environment:
      # Database connection to external RDS
      AUTHENTIK_POSTGRESQL__HOST: ${PG_HOST}
      AUTHENTIK_POSTGRESQL__PORT: ${PG_PORT}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER}
      # Redis connection
      AUTHENTIK_REDIS__HOST: redis
      # Security settings
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    restart: unless-stopped
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./media:/media
      - ./certs:/certs
      - ./custom-templates:/templates
    labels:
      # Labels for AWS deployment
      - "app=authentik"
      - "service=worker"
      - "environment=dev"

volumes:
  # Only Redis data volume needed (PostgreSQL is external RDS)
  redis_data:
    driver: local

networks:
  default:
    name: authentik-dev