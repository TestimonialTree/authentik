name: build-push-ghcr

on:
  workflow_dispatch:
  push:
    branches:
      - ci/build-ghcr

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.6.1

      - name: Log in to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate TypeScript API client
        # The Dockerfile COPYs ./gen-ts-api into the web build; it is generated
        # from the committed schema.yml (not checked in), mirroring upstream CI.
        run: |
          mkdir -p gen-ts-api
          docker run --rm -v "${PWD}:/local" --user "$(id -u):$(id -g)" \
            docker.io/openapitools/openapi-generator-cli:v7.15.0 generate \
            -i /local/schema.yml \
            -g typescript-fetch \
            -o /local/gen-ts-api \
            -c /local/scripts/api-ts-config.yaml \
            --additional-properties=npmVersion=1.0.0 \
            --git-repo-id authentik \
            --git-user-id goauthentik

      - name: Compute image tag
        id: tag
        run: echo "tag=dev-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/testimonialtree/authentik:${{ steps.tag.outputs.tag }}

      - name: Image reference
        run: echo "Pushed ghcr.io/testimonialtree/authentik:${{ steps.tag.outputs.tag }}"
